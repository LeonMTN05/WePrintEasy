name: OpenSSF Scorecard

# Bewertet das oeffentliche Repository (Sicherheitspraktiken) und veroeffentlicht das Ergebnis
# fuer das Badge in der README: https://scorecard.dev/viewer/?uri=github.com/LeonMTN05/WePrintEasy
# Mit publish_results gelten Einschraenkungen: kein env/defaults auf oberster Ebene und im Job
# nur freigegebene Actions (checkout, upload-artifact, codeql upload-sarif, scorecard-action).

on:
  branch_protection_rule:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    # Nur im oeffentlichen Repository - fuer private Repositories gibt es kein Badge
    if: github.repository == 'LeonMTN05/WePrintEasy'
    runs-on: ubuntu-latest
    permissions:
      # Ergebnisse in den Reiter "Security" (Code scanning) hochladen
      security-events: write
      # Ergebnisse veroeffentlichen und das Badge abrufen
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyse
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Ergebnis als Artefakt hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Ergebnis an Code scanning uebergeben
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
