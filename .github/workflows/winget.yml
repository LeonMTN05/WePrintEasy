name: winget

# Reicht eine veroeffentlichte Version bei winget ein (Pull Request an microsoft/winget-pkgs):
#   1. Installer vom GitHub-Release laden, gegen SHA256SUMS.txt und den Herkunftsnachweis pruefen
#   2. Manifeste aus installer/winget erzeugen (tools/New-WingetManifest.ps1), Artefakt am Lauf
#   3. winget validate, dann das Setup unbeaufsichtigt installieren und deinstallieren wie winget
#   4. mit wingetcreate einreichen. Nur mit dem Secret WINGET_TOKEN: klassisches Token (Bereich
#      public_repo) eines GitHub-Kontos, das die Microsoft-CLA unterschrieben hat; den Fork von
#      winget-pkgs legt wingetcreate in diesem Konto selbst an. Ohne Secret: nur Schritte 1-3.
# Startet nach jedem Release aus release.yml; manuell z. B. fuer eine schon veroeffentlichte Version.
# Ein Release, dessen Installer nach dem Einreichen neu gebaut wurde, hat eine andere Pruefsumme -
# dann den Pull Request in winget-pkgs von Hand korrigieren (wingetcreate submit --replace).

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      submit:
        type: boolean
        default: true
    secrets:
      WINGET_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versions-Tag eines veroeffentlichten Releases, z. B. v1.0.11'
        required: true
      submit:
        description: 'Bei winget einreichen (braucht das Secret WINGET_TOKEN)'
        type: boolean
        default: true

permissions: read-all

jobs:
  winget:
    name: winget
    if: github.repository == 'LeonMTN05/WePrintEasy'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      # gh attestation verify
      attestations: read
    env:
      TAG: ${{ inputs.tag }}
      SUBMIT: ${{ inputs.submit && 'true' || 'false' }}
      PACKAGE_ID: WePrintEasy.WePrintEasy
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer laden und pruefen
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "'$env:TAG' ist kein Versions-Tag (v1.2.3)." }
          $v = $Matches[1]
          $exe = "WePrintEasy-Setup-$v.exe"
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir dist --pattern $exe --pattern SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release $env:TAG ohne $exe oder SHA256SUMS.txt." }
          $hash = (Get-FileHash -LiteralPath "dist/$exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $line = Get-Content dist/SHA256SUMS.txt | Where-Object { ($_ -split '\s+')[1] -eq $exe }
          if (-not $line -or ($line -split '\s+')[0] -ne $hash) { throw "$exe passt nicht zu SHA256SUMS.txt." }
          gh attestation verify "dist/$exe" --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Herkunftsnachweis fuer $exe fehlt oder ist ungueltig." }
          $published = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json publishedAt --jq .publishedAt
          if ($LASTEXITCODE -ne 0 -or $published -notmatch '^(\d{4}-\d{2}-\d{2})') { throw "Datum des Releases $env:TAG nicht gefunden." }
          "VERSION=$v" >> $env:GITHUB_ENV
          "RELEASE_DATE=$($Matches[1])" >> $env:GITHUB_ENV
          Write-Host "$exe  $hash  ($($Matches[1]))"

      - name: Manifeste erzeugen
        shell: pwsh
        run: |
          $dir = ./tools/New-WingetManifest.ps1 -Version $env:VERSION -InstallerPath "dist/WePrintEasy-Setup-$env:VERSION.exe" -ReleaseDate $env:RELEASE_DATE
          "MANIFEST_DIR=$dir" >> $env:GITHUB_ENV
          Get-ChildItem -LiteralPath $dir | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content -LiteralPath $_.FullName }

      - name: Manifeste hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-${{ env.VERSION }}
          path: dist/winget
          if-no-files-found: error

      - name: Manifeste pruefen (winget validate)
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Write-Host '::warning::winget fehlt auf diesem Runner - winget validate uebersprungen.'
            exit 0
          }
          Write-Host "winget $(winget --version)"
          $out = winget validate --manifest $env:MANIFEST_DIR --disable-interactivity | Out-String
          Write-Host $out
          if ($out -notmatch 'Manifest validation succeeded') { throw 'winget validate: Manifeste ungueltig.' }

      # Wie winget: gleiche Parameter (InstallerType inno, --silent), danach Apps und Features wie im Manifest.
      # Nicht ueber "winget install": winget markiert die Datei als "aus dem Internet", und vor dem unsignierten
      # Installer fragen dann SmartScreen bzw. die Sicherheitswarnung nach - auf dem Runner antwortet niemand.
      - name: Setup testen (unbeaufsichtigt installieren und deinstallieren)
        shell: pwsh
        run: |
          $start = Get-Date
          $app = Join-Path $env:ProgramFiles 'WePrintEasy'
          $productCode = '{62BED98D-291F-401A-A240-5C8EC56F56F3}_is1'
          $innoLog = Join-Path $env:RUNNER_TEMP 'WePrintEasy-Inno.log'
          function Show-Diagnostics {
            Write-Host '--- Prozesse seit Beginn'
            Get-CimInstance Win32_Process | Where-Object { $_.CreationDate -ge $start } |
              Format-Table ProcessId, ParentProcessId, Name, CommandLine -Wrap | Out-String -Width 400 | Write-Host
            Write-Host '--- Fenster'
            Get-Process | Where-Object MainWindowTitle | Format-Table Id, ProcessName, MainWindowTitle | Out-String -Width 400 | Write-Host
            foreach ($l in $innoLog, (Join-Path $app 'Setup\WePrintEasy-Setup.log'), (Join-Path $env:TEMP 'WePrintEasy-Uninstall.log')) {
              if (Test-Path -LiteralPath $l) { Write-Host "--- $l"; Get-Content -LiteralPath $l -Tail 150 | Write-Host }
            }
          }
          # Mit Zeitgrenze - ein haengendes Setup soll nicht erst am Job-Limit scheitern
          function Invoke-Bounded([string]$File, [string]$Arguments, [int]$Minutes) {
            Write-Host "$File $Arguments"
            $p = Start-Process -FilePath $File -ArgumentList $Arguments -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit($Minutes * 60000)) {
              Show-Diagnostics
              & taskkill.exe /T /F /PID $p.Id | Out-Null
              throw "$(Split-Path -Leaf $File): nach $Minutes Minuten nicht fertig."
            }
            if ($p.ExitCode -ne 0) { Show-Diagnostics; throw "$(Split-Path -Leaf $File): Code $($p.ExitCode)" }
          }

          Invoke-Bounded (Resolve-Path "dist/WePrintEasy-Setup-$env:VERSION.exe").Path "/SP- /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=`"$innoLog`"" 10
          if (-not (Test-Path -LiteralPath (Join-Path $app 'WePrintEasy-Agent.ps1'))) { Show-Diagnostics; throw "Nach dem Setup fehlt $app\WePrintEasy-Agent.ps1." }
          $arp = Get-ItemProperty -LiteralPath "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\$productCode"
          Write-Host "Apps und Features: $($arp.DisplayName) $($arp.DisplayVersion) ($($arp.Publisher))"
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $env:MANIFEST_DIR "$env:PACKAGE_ID.installer.yaml")
          if ($arp.DisplayVersion -ne $env:VERSION) { throw "Apps und Features meldet Version '$($arp.DisplayVersion)' statt $env:VERSION." }
          if ($manifest -notmatch "(?m)^- DisplayName: $([regex]::Escape($arp.DisplayName))$" -or $manifest -notmatch "(?m)^  Publisher: $([regex]::Escape($arp.Publisher))$") {
            throw 'DisplayName/Publisher in Apps und Features passen nicht zu AppsAndFeaturesEntries im Manifest.'
          }

          # Deinstallieren wie winget: QuietUninstallString aus Apps und Features
          if ($arp.QuietUninstallString -notmatch '^"([^"]+)"\s*(.*)$') { throw "QuietUninstallString fehlt oder ist unerwartet: '$($arp.QuietUninstallString)'" }
          Invoke-Bounded $Matches[1] "$($Matches[2]) /SUPPRESSMSGBOXES /NORESTART" 10
          # Der Deinstaller laeuft aus einer temporaeren Kopie weiter; kurz auf das Entfernen des Programmordners warten
          $arpKey = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\$productCode"
          for ($i = 0; $i -lt 60 -and ((Test-Path -LiteralPath (Join-Path $app 'WePrintEasy-Agent.ps1')) -or (Test-Path -LiteralPath $arpKey)); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path -LiteralPath (Join-Path $app 'WePrintEasy-Agent.ps1')) { Show-Diagnostics; throw "Nach der Deinstallation ist $app noch vorhanden." }
          if (Test-Path -LiteralPath $arpKey) { throw 'Eintrag in Apps und Features nach der Deinstallation noch vorhanden.' }
          Write-Host "$env:PACKAGE_ID $env:VERSION unbeaufsichtigt installiert und wieder entfernt."

      - name: Bei winget einreichen
        if: env.SUBMIT == 'true'
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) {
            Write-Host "::warning::Secret WINGET_TOKEN fehlt - nicht eingereicht. Manifeste: Artefakt winget-$env:VERSION."
            exit 0
          }
          $folder = 'manifests/w/WePrintEasy/WePrintEasy'
          gh api "repos/microsoft/winget-pkgs/contents/$folder/$env:VERSION" --silent 2> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "::notice::$env:PACKAGE_ID $env:VERSION ist schon in winget-pkgs."; exit 0 }
          $open = gh pr list --repo microsoft/winget-pkgs --state open --search "$env:PACKAGE_ID $env:VERSION in:title" --json url --jq '.[].url'
          if ($open) { Write-Host "::notice::Offener Pull Request fuer $env:PACKAGE_ID $env:VERSION`: $open"; exit 0 }
          gh api "repos/microsoft/winget-pkgs/contents/$folder" --silent 2> $null
          $title = if ($LASTEXITCODE -eq 0) { "New version: $env:PACKAGE_ID version $env:VERSION" } else { "New package: $env:PACKAGE_ID version $env:VERSION" }

          # wingetcreate in fester Version, Pruefsumme wie im Manifest Microsoft.WingetCreate 1.12.13.0
          $wc = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest -Uri 'https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe' -OutFile $wc -UseBasicParsing
          if ((Get-FileHash -LiteralPath $wc -Algorithm SHA256).Hash -ne '24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA') { throw 'wingetcreate.exe: Pruefsumme stimmt nicht.' }
          & $wc submit --prtitle $title $env:MANIFEST_DIR
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate submit: Code $LASTEXITCODE" }
